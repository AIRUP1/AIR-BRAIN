name: New business leads (weekly)

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (7am Central)
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days"
        default: "10"

permissions:
  contents: write

jobs:
  pull-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Test
        run: PYTHONPATH=. pytest -q tests/test_permits.py
      - name: Pull new DFW businesses from Texas Comptroller permits
        run: PYTHONPATH=. python -m new_business_pipeline.permits --days "${{ github.event.inputs.days || '10' }}"
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: new-businesses
          path: data/new_businesses_*.csv
          if-no-files-found: ignore
      - name: Commit new leads
        run: |
          git config user.name "lead-bot"
          git config user.email "lead-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add new business leads $(date -u +%F)" && git push)
