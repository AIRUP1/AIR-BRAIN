apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: air-agents-api-data
  labels:
    app.kubernetes.io/name: air-agents-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-agents-api
  labels:
    app.kubernetes.io/name: air-agents-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: air-agents-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: air-agents-api
    spec:
      containers:
        - name: api
          image: ghcr.io/airup1/air-brain:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AIR_AGENTS_ENV
              value: production
            - name: AIR_AGENTS_DATABASE_PATH
              value: /app/data/air_agents.db
            - name: AIR_AGENTS_ENABLE_PUBLIC_INTAKE
              value: "true"
            - name: AIR_AGENTS_CORS_ORIGINS
              value: https://airagentsllc.co,https://www.airagentsllc.co
            - name: AIR_AGENTS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: air-agents-api-secrets
                  key: api-keys-json
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: air-agents-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: air-agents-api
  labels:
    app.kubernetes.io/name: air-agents-api
spec:
  selector:
    app.kubernetes.io/name: air-agents-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
